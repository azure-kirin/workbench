<!doctype html>
<html lang="en">
  <body style="background-color: #ffffff">
    <p id="fails" style="color: #777777; font-size: 16px; font-weight: 400">
      Grey on white, just under the threshold.
    </p>
    <p id="passes" style="color: #595959; font-size: 16px; font-weight: 400">
      Darker grey on white, just over it.
    </p>
    <p id="large" style="color: #777777; font-size: 28px; font-weight: 400">
      The same grey, at a size the guideline treats as large text.
    </p>
    <div id="card" style="background-color: #eeeeee">
      <p id="on-card" style="color: #777777; font-size: 16px; font-weight: 400">
        The same grey again, on a surface nobody checked it against.
      </p>
    </div>
    <div id="photo" style="background-image: url(nothing.png)">
      <p id="on-photo" style="color: #777777; font-size: 16px; font-weight: 400">
        On an image, where no static reading can say what is behind the text.
      </p>
    </div>
    <svg id="chart" width="200" height="20" style="color: #777777">
      <text x="0" y="15" style="color: #777777; fill: #000000">SVG text, painted by fill.</text>
    </svg>
  </body>
</html>
